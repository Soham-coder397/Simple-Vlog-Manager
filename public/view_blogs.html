<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Blogs</title>
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/view_blogs.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css">
</head>
<body>
    <nav class="navbar">
        <div class="desktop">
            <img src="img/logo.png" class="logo" alt="Logo">
            <ul class="links-container">
                <li class="link-item"><a href="/" class="link">Home</a></li>
                <li class="link-item"><a href="/add_blog" class="link">Write A Blog</a></li>
            </ul>
        </div>
        <div class="mobile">
            <img src="img/logo.png" class="logo" alt="Logo">
            <button id="menuBtn">
                <i id="icon" class="fa-solid fa-bars"></i>
            </button>
            <ul id="menu">
                <li><a href="/"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a href="/add_blog"><i class="fa-solid fa-file-pen"></i> Write A Blog</a></li>
            </ul>
        </div>
    </nav>

    <h1 class="title">All Blogs</h1>
    <div id="blogs"></div>
        <footer id="contact">
        <div class="footer-container">
            <div>
                <h3>Simple Blog Manager</h3>
                <p> A modern blogging platform where writers can create, publish and manage blog posts with ease. </p>
            </div>

            <div>
                <h3>Quick Links</h3>
                <a href="/">home</a>
                <a href="/add_blog">write a blog</a>
            </div>
            <div>
                <h3>Contact</h3>
                <p>sohamghosh638@gmail.com</p>
                <p>+91 9635217993</p>
            </div>
        </div>
        <hr>
        <p class="copyright"> © 2026 Simple Blog Manager </p>
    </footer>
    <div id="edit-popup" class="edit-popup">
        <div class="popup-box">
            <main>
                <!-- ==================== FORM ==================== -->
                <section>
                    <form id="blogform" enctype="multipart/form-data">
                        <input type="hidden" id="blogId">
                        <!-- Blog Details -->
                        <fieldset>
                            <!-- Blog Title -->
                            <div>
                                <label for="title">
                                    <strong>Blog Title</strong>
                                </label>
                                <input type="text" id="title" name="title"
                                    placeholder="Enter an interesting blog title">
                            </div>
                            <br>
                            <!-- Author -->
                            <div>
                                <label for="author">
                                    <strong>Author Name</strong>
                                </label>
                                <input type="text" id="author" name="author" placeholder="Enter your name">
                            </div>
                            <br>
                            <!-- Category -->
                            <div class="form-group">
                                <label for="category" class="category">
                                    <strong>Category</strong>
                                </label>
                                <select id="category" name="category">
                                    <option value="">Select Category</option>
                                    <option>Technology</option>
                                    <option>Programming</option>
                                    <option>Artificial Intelligence</option>
                                    <option>Web Development</option>
                                    <option>Science</option>
                                    <option>Education</option>
                                    <option>Sports</option>
                                    <option>Travel</option>
                                    <option>Railways</option>
                                </select>
                            </div>
                            <br>
                            <!-- Short Description -->
                            <div>
                                <label for="description">
                                    <strong>Short Description</strong>
                                </label>
                                <textarea id="description" name="description" rows="2"
                                    placeholder="Write a short introduction or summary of your blog..."></textarea>
                            </div>
                            <br>
                            <!-- Blog Content -->
                            <div>
                                <label for="content">
                                    <strong>Write Your Blog</strong>
                                </label>
                                <textarea id="content" name="content" rows="5"
                                    placeholder="Start writing your blog content here..."></textarea>
                            </div>
                            <br>
                            <div>
                                <label><strong>Upload Image</strong></label>
                                <input
                                    type="file"
                                    id="image"
                                    name="image"
                                    accept="image/*"
                                >
                                <br>
                                <img
                                    id="previewImage"
                                    src=""
                                    alt="Preview"
                                    style="
                                        width:180px;
                                        display:none;
                                        border-radius:8px;
                                        border:1px solid #ccc;
                                        object-fit:cover;
                                    "
                                >
                            </div>
                            <br>
                        </fieldset>
                        <!-- Buttons -->
                        <div>
                            <button type="submit" class="update" id="updateBtn">
                                Update
                            </button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script src="js/view_blogs.js"></script>
</body>
</html>
